name: H-Auto Device Offline Check

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h-auto-device-offline-cron
  cancel-in-progress: false

jobs:
  check-device-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      H_AUTO_PRODUCTION_URL: ${{ vars.H_AUTO_PRODUCTION_URL }}
      H_AUTO_CRON_SECRET: ${{ secrets.H_AUTO_CRON_SECRET }}
    steps:
      - name: Validate scheduler configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${H_AUTO_PRODUCTION_URL}" ]]; then
            echo "::error::Missing repository variable H_AUTO_PRODUCTION_URL."
            exit 1
          fi

          if [[ -z "${H_AUTO_CRON_SECRET}" ]]; then
            echo "::error::Missing repository secret H_AUTO_CRON_SECRET."
            exit 1
          fi

          if [[ "${H_AUTO_PRODUCTION_URL}" != https://* ]]; then
            echo "::error::H_AUTO_PRODUCTION_URL must use HTTPS."
            exit 1
          fi

          if [[ "${H_AUTO_PRODUCTION_URL}" == */ ]]; then
            echo "::error::H_AUTO_PRODUCTION_URL must not end with a slash."
            exit 1
          fi

      - name: Run offline-device scan
        shell: bash
        run: |
          set -uo pipefail

          response_file="$(mktemp)"

          set +e
          status="$(
            curl \
              --request GET \
              --silent \
              --show-error \
              --max-time 90 \
              --retry 2 \
              --retry-delay 5 \
              --retry-max-time 180 \
              --retry-connrefused \
              --header "Authorization: Bearer ${H_AUTO_CRON_SECRET}" \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              "${H_AUTO_PRODUCTION_URL}/api/cron/device-offline"
          )"
          curl_exit=$?
          set -e

          body="$(cat "${response_file}" 2>/dev/null || true)"
          rm -f "${response_file}"

          echo "Target : ${H_AUTO_PRODUCTION_URL}/api/cron/device-offline"
          echo "Status : ${status:-<none>}"

          if [[ "${curl_exit}" -ne 0 ]]; then
            echo "::error::curl failed at the transport level (exit ${curl_exit})."
            exit 1
          fi

          if [[ "${status}" != "200" ]]; then
            echo "::error::Expected HTTP 200, got ${status}."
            # Body is surfaced only on failure. This repository is public and
            # workflow logs are world-readable, so successful scan output —
            # which may name devices, plots, or alerts — stays out of the log.
            echo "Body: ${body:-<empty>}"
            if [[ "${status}" =~ ^3 ]]; then
              echo "::error::A 3xx means the request was redirected before reaching the route handler. Check PUBLIC_PATHS in src/proxy.ts, and confirm H_AUTO_PRODUCTION_URL is the canonical www host (the apex 308-redirects and drops the Authorization header)."
            fi
            exit 1
          fi

          echo "Scan completed successfully."
